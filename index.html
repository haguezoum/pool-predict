<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/webp" href="/wa-validi.webp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="1337 Pool Predict — campus pool match predictions for 42 Network"
    />
    <meta name="theme-color" content="#f5f8fc" />
    <title>1337 Pool Predict</title>
    <script>
      // Apply theme before paint — default follows the machine
      ;(function () {
        try {
          var stored = localStorage.getItem('pool-predict-theme')
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#001030' : '#f5f8fc')
        } catch (_) {}
      })()
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="1337 Pool" />
    <meta property="og:title" content="1337 Pool Predict" />

      property="og:description"
      content="Predict campus pool matches. Climb the board. Only for 42 students."

  </head>
